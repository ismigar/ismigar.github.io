name: public-site-quality

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Verify localized landing parity
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python scripts/check_locale_parity.py --base-ref "$BASE_SHA"

      - name: Verify navigation syntax
        run: |
          node --check navigation.js
          node --check release-history.mjs
          node --test tests/release-history.test.mjs tests/learn.test.mjs

      - name: Verify published release history
        run: python scripts/sync_release_history.py --check

      - name: Validate the public model-evaluation bank
        run: python scripts/model_evaluations.py --check

      - name: Run public-site tests
        run: python -m unittest discover -s tests -v

  marketplace:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: growth-dashboard
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22.22.2'
          cache: npm
          cache-dependency-path: growth-dashboard/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx --no-install playwright install --with-deps chromium
      - run: npm run test:e2e -- --workers=2
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: marketplace-browser-failures
          path: growth-dashboard/test-results
          retention-days: 5
