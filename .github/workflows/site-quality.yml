name: public-site-quality

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Verify localized landing parity
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python scripts/check_locale_parity.py --base-ref "$BASE_SHA"

      - name: Verify navigation syntax
        run: node --check navigation.js

      - name: Run public-site tests
        run: python -m unittest discover -s tests -v
